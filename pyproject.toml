[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-jingle-sound-forge"
version = "0.4.2"
description = "AI jingle / brand sound generator — text brief + brand kit to short audio motifs."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jingle Forge Contributors" }]
keywords = ["audio", "jingle", "brand", "generative", "sound-design", "windows"]
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnxruntime>=1.18",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]
gpu = ["onnxruntime-gpu>=1.18"]
cpp = ["pybind11>=2.12"]

[project.scripts]
forge = "forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"